name: Release

# A version tag (v1.2.3) publishes both images to GitHub Container Registry:
# scanned before anything is pushed (a fixable HIGH/CRITICAL vulnerability
# stops the release), pushed with SBOM and SLSA provenance attestations,
# signed keyless with cosign (Sigstore, this workflow's OIDC identity), and
# attested with GitHub build provenance. Deploy by digest after verifying -
# see docs/DEPLOYMENT.md, "Release images". Tag only commits that passed CI.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Add required reviewers to this environment to approve each release.
    environment: release
    permissions:
      contents: read
      packages: write       # push to ghcr.io
      id-token: write       # keyless signing and provenance (OIDC)
      attestations: write   # GitHub artifact attestations
    strategy:
      fail-fast: true
      matrix:
        image:
          - {name: nexusflow-ai, dockerfile: docker/Dockerfile}
          - {name: nexusflow-browser, dockerfile: docker/Dockerfile.browser}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - name: Image name (registries want lower case)
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ matrix.image.name }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/${NAME}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Tags (version, major.minor, commit)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - name: Build for scanning (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          load: true
          provenance: false
          sbom: false
          tags: ${{ matrix.image.name }}:candidate
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
      - name: Trivy - stop on fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ matrix.image.name }}:candidate
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (SBOM and provenance attestations attached)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
      # Signing and GitHub attestations run from a public repository: Sigstore's
      # transparency log is public (it would name a private repository), and
      # attestations for private repositories need GitHub Enterprise Cloud.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        if: ${{ !github.event.repository.private }}
      - name: Sign the image (keyless, by digest)
        if: ${{ !github.event.repository.private }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: GitHub build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: SBOM (CycloneDX) of the published image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: ${{ matrix.image.name }}.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-${{ matrix.image.name }}
          path: ${{ matrix.image.name }}.cdx.json
          retention-days: 90
      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### ${IMAGE}"
            echo
            echo "Deploy by digest: \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
