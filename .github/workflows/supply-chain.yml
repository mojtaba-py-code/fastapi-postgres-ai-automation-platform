name: Supply chain

# Dependency review blocks a pull request that adds a dependency with a known
# vulnerability (moderate or worse) or an incompatible licence. OpenSSF
# Scorecard grades the repository's supply-chain practices every week and on
# every push to main. Both need a public repository (or GitHub Advanced
# Security); on a private one they are skipped rather than failing.
#
# Every week, Trivy also scans every third-party image the stack runs as it
# is (the images built here - and the bases they are built from - are scanned
# by CI on every change and every week): a fixable HIGH or CRITICAL finding
# means "update that pin" (make pin-images). A finding the newest upstream
# release still carries is triaged in .trivyignore.yaml, with its reason and
# an expiry date.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  third-party-images:
    name: Third-party images (list)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - id: list
        # Standard library only: the runner's own Python.
        run: |
          images="$(python3 scripts/pin_images.py --list \
            | python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))')"
          echo "images=${images}" >> "$GITHUB_OUTPUT"

  third-party-image-scan:
    name: Trivy
    needs: third-party-images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # n8n is optional (a Compose profile) and ships its own dependency tree,
    # whose findings only n8n can fix: its scan is reported, not a failure of
    # the run (SECURITY.md, "Third-party images").
    continue-on-error: ${{ startsWith(matrix.image, 'n8nio/n8n:') }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.third-party-images.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}   # .trivyignore.yaml
      - name: Trivy - fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml
          # gosu (postgres, redis, rabbitmq) only steps down from root, and the
          # stack starts those containers as their own users, so it never runs;
          # its maintainers do not rebuild it for Go library code it does not
          # call (github.com/tianon/gosu, SECURITY.md).
          skip-files: usr/local/bin/gosu

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0-only, GPL-3.0-or-later

  scorecard:
    name: OpenSSF Scorecard
    if: ${{ github.event_name != 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # upload the results to code scanning
      id-token: write  # publish the results to the OpenSSF API (signed with OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: scorecard.sarif
