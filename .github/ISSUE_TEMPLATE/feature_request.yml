name: Feature request
description: Propose a capability the platform does not have.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and why the platform does not let you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it could work - API, console, configuration.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and tenancy
      description: >-
        Who may use it (roles, permissions), what it reads or changes, and whether
        it crosses a trust boundary (other tenants, outbound requests, AI providers).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
