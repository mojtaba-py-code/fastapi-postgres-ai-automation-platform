# NexusFlow AI - production-like single-host deployment.
#
#   python scripts/generate_secrets.py        # once: ./secrets (dir 0700)
#   python scripts/internal_pki.py            # once: CA + certificates for internal TLS
#   cp .env.example .env && $EDITOR .env      # domain, image tags, TLS paths
#   docker compose up -d --build
#
# Security layout (see docs/DEPLOYMENT.md and docs/THREAT_MODEL.md):
# * nginx is the ONLY container with published ports; the n8n editor and
#   Grafana are published on 127.0.0.1 only (reach them through an SSH tunnel);
# * every other network is `internal` (no route to the internet) except
#   `egress`, joined only by the integrations worker, the sandbox and the
#   headless browser; the pipeline worker and both APIs have no egress;
# * all secrets are files under /run/secrets, never environment values;
# * PostgreSQL, both Redis instances and RabbitMQ accept TLS connections only,
#   and every client verifies the server's certificate and host name against
#   the stack's private CA (scripts/internal_pki.py);
# * every container has no-new-privileges and a memory limit, and drops all
#   capabilities; the platform's own containers (API, workers, sandbox,
#   browser) and nginx, Redis, Prometheus, Alertmanager and Grafana also run
#   read-only and as non-root. The exceptions are the upstream images that need
#   them: PostgreSQL and ClamAV start as root with the few capabilities their
#   entrypoints use to drop privileges; RabbitMQ, n8n and ClamAV keep a
#   writable root filesystem.

name: nexusflow

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

x-app: &app
  <<: *hardened
  image: ${NEXUSFLOW_IMAGE:-nexusflow-ai:latest}
  build: {context: ., dockerfile: docker/Dockerfile}
  tmpfs: ["/tmp:size=64m,mode=1777,noexec,nosuid,nodev"]
  pids_limit: 256

x-app-env: &app-env
  NEXUSFLOW_APP__ENVIRONMENT: production
  NEXUSFLOW_APP__PUBLIC_BASE_URL: https://${NEXUSFLOW_DOMAIN:?set NEXUSFLOW_DOMAIN in .env}
  NEXUSFLOW_APP__ALLOWED_HOSTS: '["${NEXUSFLOW_DOMAIN}","localhost","api","api-internal"]'
  NEXUSFLOW_APP__TRUSTED_PROXIES: '["${NEXUSFLOW_EDGE_SUBNET:-172.28.1.0/24}"]'
  NEXUSFLOW_APP__CORS_ALLOWED_ORIGINS: ${NEXUSFLOW_CORS_ORIGINS:-[]}
  NEXUSFLOW_APP__SIGNUP_ENABLED: ${NEXUSFLOW_SIGNUP_ENABLED:-}   # unset: sign-up open
  NEXUSFLOW_DATABASE__URL_FILE: /run/secrets/db_app_url
  NEXUSFLOW_REDIS__URL_FILE: /run/secrets/redis_app_url
  NEXUSFLOW_BROKER__URL_FILE: /run/secrets/broker_platform_url
  NEXUSFLOW_SECURITY__JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
  NEXUSFLOW_SECURITY__ENCRYPTION_KEYS_FILE: /run/secrets/encryption_keys
  NEXUSFLOW_SECURITY__HMAC_PEPPER_FILE: /run/secrets/hmac_pepper
  NEXUSFLOW_N8N__WEBHOOK_JWT_SECRET_FILE: /run/secrets/n8n_webhook_jwt_secret
  # Internal TLS: encrypted, and each server's certificate and host name verified.
  NEXUSFLOW_DATABASE__SSL_MODE: verify-full
  NEXUSFLOW_DATABASE__SSL_ROOT_CERT: /run/secrets/internal_ca
  NEXUSFLOW_REDIS__SSL_CA_CERTS: /run/secrets/internal_ca
  NEXUSFLOW_BROKER__USE_SSL: "true"
  NEXUSFLOW_BROKER__SSL_CA_CERTS: /run/secrets/internal_ca
  # internal: the platform orchestrates itself (works out of the box). Switch to
  # n8n after provisioning the workflows (workflows/n8n/README.md).
  NEXUSFLOW_N8N__ORCHESTRATION: ${NEXUSFLOW_ORCHESTRATION:-internal}
  # Only the integrations worker calls an AI provider (and holds its key).
  NEXUSFLOW_AI__PROVIDER: offline
  NEXUSFLOW_NOTIFICATIONS__SMTP_HOST: ${NEXUSFLOW_SMTP_HOST:-}
  NEXUSFLOW_NOTIFICATIONS__SMTP_PORT: ${NEXUSFLOW_SMTP_PORT:-587}
  NEXUSFLOW_NOTIFICATIONS__SMTP_TLS_MODE: ${NEXUSFLOW_SMTP_TLS_MODE:-starttls}
  NEXUSFLOW_NOTIFICATIONS__SMTP_USERNAME: ${NEXUSFLOW_SMTP_USERNAME:-}
  NEXUSFLOW_NOTIFICATIONS__SMTP_FROM: ${NEXUSFLOW_SMTP_FROM:-alerts@nexusflow.example.com}
  NEXUSFLOW_NOTIFICATIONS__OPERATOR_EMAILS: ${NEXUSFLOW_OPERATOR_EMAILS:-[]}
  NEXUSFLOW_OBSERVABILITY__LOG_FORMAT: json
  NEXUSFLOW_OBSERVABILITY__OTLP_ENDPOINT: ${NEXUSFLOW_OTLP_ENDPOINT:-}
  # Only the sandbox calls the renderer; the API needs to know that one exists.
  NEXUSFLOW_SCRAPING__BROWSER_SERVICE_URL: http://renderer:8090

x-app-secrets: &app-secrets
  - internal_ca
  - db_app_url
  - redis_app_url
  - broker_platform_url
  - jwt_private_key
  - encryption_keys
  - hmac_pepper
  - n8n_webhook_jwt_secret

services:
  # ------------------------------------------------------------------ edge
  nginx:
    <<: *hardened
    image: ${NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.30-alpine-slim@sha256:307ca0bded4dda86dade6f5bd2a2551601bec9bac3fd73a21613fabcd9eca66a}
    tmpfs: ["/tmp:size=32m,noexec,nosuid,nodev"]
    ports:
      # IPv4 only: an IPv6 client would reach nginx through Docker's userland
      # proxy and appear as the bridge gateway - one address for all of them
      # (rate limits, sign-in risk and network allowlists). See DEPLOYMENT.md.
      - "0.0.0.0:80:8080"
      - "0.0.0.0:443:8443"
      - "127.0.0.1:5678:5678"   # n8n editor - SSH tunnel only
      - "127.0.0.1:3000:3000"   # Grafana - SSH tunnel only
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - ./web:/usr/share/nginx/console:ro   # the web console (static files)
      - ${NEXUSFLOW_TLS_DIR:-./deploy/certs}:/etc/nginx/tls:ro
      - ./deploy/acme:/var/www/acme:ro      # certbot --webroot challenges
    environment:
      NEXUSFLOW_DOMAIN: ${NEXUSFLOW_DOMAIN}
    depends_on:
      api: {condition: service_healthy}
    networks: [public, edge, admin]
    mem_limit: 256m
    pids_limit: 128

  # ------------------------------------------------------------ platform
  migrate:
    <<: *app
    command: ["nexusflow", "migrate"]
    restart: "no"
    environment:
      <<: *app-env
      NEXUSFLOW_DATABASE__MIGRATOR_URL_FILE: /run/secrets/db_migrator_url
    secrets: [internal_ca, db_migrator_url, db_app_url, redis_app_url, broker_platform_url,
              jwt_private_key, encryption_keys, hmac_pepper, n8n_webhook_jwt_secret]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend]
    mem_limit: 256m

  api:
    <<: *app
    environment:
      <<: *app-env
      # Multipart uploads spool to disk, not to the small in-memory /tmp.
      TMPDIR: /var/tmp/nexusflow
      # clamav:3310 with `--profile av`; unset: uploads are not malware-scanned.
      NEXUSFLOW_STORAGE__CLAMAV_ADDRESS: ${NEXUSFLOW_CLAMAV_ADDRESS:-}
    secrets: *app-secrets
    volumes:
      - nexusflow-data:/var/lib/nexusflow
      - api-tmp:/var/tmp/nexusflow
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [edge, backend, av]
    mem_limit: 768m
    cpus: 2

  api-internal:
    <<: *app
    command: ["uvicorn", "nexusflow.apps.api.main:create_internal_app", "--factory",
              "--host", "0.0.0.0", "--port", "8001", "--no-proxy-headers", "--no-server-header"]
    environment:
      <<: *app-env
      NEXUSFLOW_HEALTHCHECK_PORT: "8001"
      # Operators run the CLI here (it reaches n8n): the kill switch unpublishes
      # n8n workflows with this key. Empty until created in n8n.
      NEXUSFLOW_N8N__API_KEY_FILE: /run/secrets/n8n_api_key
    secrets: [internal_ca, db_app_url, redis_app_url, broker_platform_url, jwt_private_key,
              encryption_keys, hmac_pepper, n8n_webhook_jwt_secret, n8n_api_key]
    volumes: ["nexusflow-data:/var/lib/nexusflow:ro"]   # streams upload input to the sandbox
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [backend, automation, sandbox_net]
    mem_limit: 1g                                        # parses (bounded) sandbox results

  worker-pipeline:
    <<: *app
    tmpfs:
      - "/tmp:size=64m,mode=1777,noexec,nosuid,nodev"
      # Metric files of the prefork children (one set per child): kept apart
      # from /tmp, so they cannot fill it, and emptied at every start.
      - "/run/prometheus:size=128m,mode=0700,uid=10001,gid=10001,noexec,nosuid,nodev"
    command: ["celery", "-A", "nexusflow.apps.workers.app:celery_app", "worker", "-Q", "pipeline",
              "--concurrency", "4", "--without-gossip", "--without-mingle", "--loglevel", "INFO"]
    environment:
      <<: *app-env
      NEXUSFLOW_HEALTHCHECK: heartbeat                 # see docker/healthcheck.py
      NEXUSFLOW_HEARTBEAT_PATH: /tmp/nexusflow-heartbeat
      NEXUSFLOW_OBSERVABILITY__WORKER_METRICS_PORT: "9101"
      PROMETHEUS_MULTIPROC_DIR: /run/prometheus   # its own tmpfs, see below
    secrets: *app-secrets
    volumes: ["nexusflow-data:/var/lib/nexusflow"]      # reports, purges
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [backend]                                 # no internet egress
    mem_limit: 1g

  worker-integrations:
    <<: *app
    tmpfs:
      - "/tmp:size=64m,mode=1777,noexec,nosuid,nodev"
      # Metric files of the prefork children (one set per child): kept apart
      # from /tmp, so they cannot fill it, and emptied at every start.
      - "/run/prometheus:size=128m,mode=0700,uid=10001,gid=10001,noexec,nosuid,nodev"
    command: ["celery", "-A", "nexusflow.apps.workers.app:celery_app", "worker", "-Q", "integrations",
              "--concurrency", "4", "--without-gossip", "--without-mingle", "--loglevel", "INFO"]
    environment:
      <<: *app-env
      NEXUSFLOW_HEALTHCHECK: heartbeat                 # see docker/healthcheck.py
      NEXUSFLOW_HEARTBEAT_PATH: /tmp/nexusflow-heartbeat
      NEXUSFLOW_OBSERVABILITY__WORKER_METRICS_PORT: "9101"
      PROMETHEUS_MULTIPROC_DIR: /run/prometheus   # its own tmpfs, see below
      # The only process that calls an AI provider or an SMTP relay holds their
      # credentials (empty secret files mean "not configured").
      NEXUSFLOW_AI__PROVIDER: ${NEXUSFLOW_AI_PROVIDER:-offline}
      NEXUSFLOW_AI__API_KEY_FILE: /run/secrets/ai_api_key
      NEXUSFLOW_NOTIFICATIONS__SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    secrets: [internal_ca, db_app_url, redis_app_url, broker_platform_url, jwt_private_key,
              encryption_keys, hmac_pepper, n8n_webhook_jwt_secret, ai_api_key, smtp_password]
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [backend, automation, egress]             # APIs, AI, SMTP, Slack, n8n events
    mem_limit: 1g

  beat:
    <<: *app
    command: ["celery", "-A", "nexusflow.apps.workers.app:celery_app", "beat",
              "--schedule", "/tmp/celerybeat-schedule", "--pidfile", "/tmp/celerybeat.pid",
              "--loglevel", "INFO"]
    environment:
      <<: *app-env
      NEXUSFLOW_HEALTHCHECK: heartbeat                 # see docker/healthcheck.py
      NEXUSFLOW_HEARTBEAT_PATH: /tmp/nexusflow-heartbeat
    secrets: *app-secrets
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [backend]
    mem_limit: 256m

  # ------------------------------------------------------------- sandbox
  sandbox:
    <<: *app
    command: ["celery", "-A", "nexusflow.apps.workers.sandbox:celery_app", "worker", "-Q", "sandbox",
              "--concurrency", "2", "--without-gossip", "--without-mingle", "--without-heartbeat",
              "--loglevel", "INFO"]
    tmpfs: ["/tmp:size=256m,mode=1777,noexec,nosuid,nodev"]
    environment:
      # Deliberately NO database, key material or provider credentials.
      NEXUSFLOW_APP__ENVIRONMENT: production
      NEXUSFLOW_HEALTHCHECK: heartbeat                 # see docker/healthcheck.py
      NEXUSFLOW_HEARTBEAT_PATH: /tmp/nexusflow-heartbeat
      NEXUSFLOW_BROKER__URL_FILE: /run/secrets/broker_sandbox_url
      NEXUSFLOW_BROKER__USE_SSL: "true"
      NEXUSFLOW_BROKER__SSL_CA_CERTS: /run/secrets/internal_ca
      NEXUSFLOW_SANDBOX__REDIS_URL_FILE: /run/secrets/redis_sandbox_url
      NEXUSFLOW_SANDBOX__REDIS_SSL_CA_CERTS: /run/secrets/internal_ca
      NEXUSFLOW_SANDBOX__GATEWAY_URL: http://api-internal:8001
      NEXUSFLOW_SCRAPING__BROWSER_SERVICE_URL: http://renderer:8090   # render network only
      NEXUSFLOW_SCRAPING__BROWSER_SERVICE_TOKEN_FILE: /run/secrets/browser_token
      NEXUSFLOW_OBSERVABILITY__LOG_FORMAT: json
    secrets: [internal_ca, broker_sandbox_url, redis_sandbox_url, browser_token]
    depends_on:
      api-internal: {condition: service_healthy}
      redis-sandbox: {condition: service_healthy}
    networks: [sandbox_net, render, egress]
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128

  browser:
    <<: *hardened
    image: ${NEXUSFLOW_BROWSER_IMAGE:-nexusflow-browser:latest}
    build: {context: ., dockerfile: docker/Dockerfile.browser}
    tmpfs:
      - "/tmp:size=256m,mode=1777,nosuid,nodev"
      - "/home/renderer:size=64m,uid=10002,gid=10002,mode=0700,nosuid,nodev"
    shm_size: 512m
    environment:
      NEXUSFLOW_APP__ENVIRONMENT: production
      NEXUSFLOW_BROWSER__TOKEN_FILE: /run/secrets/browser_token
      NEXUSFLOW_OBSERVABILITY__LOG_FORMAT: json
    secrets: [browser_token]
    networks:
      # "renderer" exists on the render network only, so the sandbox never
      # resolves the browser's egress address (egress drops container traffic).
      render: {aliases: [renderer]}
      egress: {}
    mem_limit: 1536m
    cpus: 2
    pids_limit: 512

  # ---------------------------------------------------------- automation
  n8n:
    <<: *hardened
    # Opt-in (COMPOSE_PROFILES=n8n): the platform orchestrates itself by default,
    # and an n8n that is running but not set up can be claimed by whoever calls
    # its owner set-up first. Set the owner up as soon as you enable it.
    profiles: ["n8n"]
    init: false                   # the image runs its own init (tini)
    image: ${N8N_IMAGE:-n8nio/n8n:2.40.7@sha256:ffeb52485f78b1b06c9a832205853cf75da72a07a514c9a27724df85979d6c34}   # keep current: n8n ships frequent security fixes
    read_only: false              # n8n writes its settings/cache under /home/node
    tmpfs: ["/tmp:size=64m,noexec,nosuid,nodev"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/n8n_db_password
      # TLS to PostgreSQL, verified against the stack's CA (the file's contents).
      DB_POSTGRESDB_SSL_CA_FILE: /run/secrets/internal_ca
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://n8n:5678/   # WEBHOOK_URL is deprecated in n8n 2.x
      N8N_SECURE_COOKIE: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.code","n8n-nodes-base.function","n8n-nodes-base.functionItem","n8n-nodes-base.ssh","n8n-nodes-base.ftp","n8n-nodes-base.readWriteFile","n8n-nodes-base.readBinaryFile","n8n-nodes-base.readBinaryFiles","n8n-nodes-base.writeBinaryFile","n8n-nodes-base.localFileTrigger"]'
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      # No npm packages installed from the editor: that is a code-execution path.
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      GENERIC_TIMEZONE: UTC
    secrets: [internal_ca, n8n_db_password, n8n_encryption_key]
    volumes: ["n8n-data:/home/node/.n8n"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [automation, n8n_data, admin]   # no internet egress
    mem_limit: 1g

  # ------------------------------------------------------------- data
  postgres:
    <<: *hardened
    image: ${POSTGRES_IMAGE:-postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24}
    # The image's own "postgres" user from the start: no root, no capabilities
    # (the entrypoint supports it; the data volume belongs to that user).
    user: postgres
    tmpfs: ["/tmp:size=64m", "/var/run/postgresql:size=8m"]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    # PostgreSQL refuses a key file others can read, and Compose mounts secrets
    # with their host mode: install a private copy first.
    entrypoint:
      - sh
      - -ec
      - |
        install -d -m 0700 /var/run/postgresql/tls
        install -m 0600 /run/secrets/tls_postgres_key /var/run/postgresql/tls/server.key
        install -m 0644 /run/secrets/tls_postgres_cert /var/run/postgresql/tls/server.crt
        exec docker-entrypoint.sh "$$@"
      - docker-entrypoint.sh
    command: ["postgres",
              "-c", "ssl=on",
              "-c", "ssl_cert_file=/var/run/postgresql/tls/server.crt",
              "-c", "ssl_key_file=/var/run/postgresql/tls/server.key",
              "-c", "ssl_min_protocol_version=TLSv1.2",
              "-c", "hba_file=/etc/postgresql/pg_hba.conf",   # TLS-only over the network
              "-c", "password_encryption=scram-sha-256",
              "-c", "log_connections=on", "-c", "log_disconnections=on",
              "-c", "log_min_duration_statement=1000",
              "-c", "shared_preload_libraries=pg_stat_statements",
              "-c", "max_connections=200"]
    secrets: [postgres_password, db_app_password, db_migrator_password, n8n_db_password,
              tls_postgres_cert, tls_postgres_key]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./deploy/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      # TCP, not the socket: during initdb the temporary server listens on the
      # socket only, and must not be reported healthy to the migrate job.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend, n8n_data]
    mem_limit: 1g
    shm_size: 256m

  redis:
    <<: *hardened
    image: ${REDIS_IMAGE:-redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499}
    user: "999:1000"
    command: ["redis-server", "/usr/local/etc/redis/redis-tls.conf"]
    volumes:
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./deploy/redis/redis-tls.conf:/usr/local/etc/redis/redis-tls.conf:ro
      - redis-data:/data
    secrets: [redis_users_acl, internal_ca, tls_redis_cert, tls_redis_key]
    healthcheck:
      # Unauthenticated PING answers NOAUTH: proves liveness without a password.
      test: ["CMD-SHELL", "redis-cli --tls --cacert /run/secrets/internal_ca -h 127.0.0.1 ping 2>&1 | grep -Eq 'PONG|NOAUTH'"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]                 # the sandbox has its own instance below
    mem_limit: 384m

  redis-sandbox:
    # Disposable robots.txt / host-throttle cache for the sandbox pool only:
    # no persistence, LRU eviction, nothing the platform depends on.
    <<: *hardened
    image: ${REDIS_IMAGE:-redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499}
    user: "999:1000"
    command: ["redis-server", "/usr/local/etc/redis/redis-tls.conf"]
    volumes:
      - ./deploy/redis/redis-sandbox.conf:/usr/local/etc/redis/redis.conf:ro
      - ./deploy/redis/redis-sandbox-tls.conf:/usr/local/etc/redis/redis-tls.conf:ro
    secrets: [redis_sandbox_acl, internal_ca, tls_redis_sandbox_cert, tls_redis_sandbox_key]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /run/secrets/internal_ca -h 127.0.0.1 ping 2>&1 | grep -Eq 'PONG|NOAUTH'"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [sandbox_net]
    mem_limit: 128m

  rabbitmq:
    <<: *hardened
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.3-alpine@sha256:2531fe16e1cb4ec4086d3eaa63118c8f074dd98620d55f022f453a397b18f037}
    # Start as the image's own user: its entrypoint only switches users when it
    # runs as root, which would need SETUID/SETGID (all capabilities are dropped).
    user: rabbitmq
    # RabbitMQ keeps its data under rabbit@<hostname>: a fixed name, or every
    # recreated container would start empty and strand the queued jobs.
    hostname: rabbitmq
    read_only: false              # Erlang cookie / mnesia live in the volume
    environment:
      RABBITMQ_CONFIG_FILES: /etc/rabbitmq/conf.d
    volumes:
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-nexusflow.conf:ro
      - ./deploy/rabbitmq/tls.conf:/etc/rabbitmq/conf.d/20-tls.conf:ro   # AMQP over TLS only
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq
    secrets: [rabbitmq_definitions, internal_ca, tls_rabbitmq_cert, tls_rabbitmq_key]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [backend, sandbox_net]
    mem_limit: 768m

  clamav:
    <<: *hardened
    profiles: ["av"]              # enable: docker compose --profile av up -d
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.4@sha256:a5f03c12a79dbe9f6d8a527b6bb1ea053fa8dd061d3738a26897f055ee2d9303}
    read_only: false
    # Upstream's unprivileged mode: no root, no capabilities.
    user: clamav
    entrypoint: ["/init-unprivileged"]
    # Scans hostile uploads: reachable only from the API (av), never from the
    # database/broker network; egress only for signature updates.
    networks: [av, egress]
    # Upstream's minimum is 3 GiB, 4 recommended: a signature update builds a
    # second engine before dropping the old one. Below that clamd is killed on
    # its first update and every upload is refused (MalwareScannerUnavailable).
    mem_limit: 4g

  # ---------------------------------------------------------- monitoring
  prometheus:
    <<: *hardened
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.3@sha256:6976aa8a60fec930796ce5772b8d12da7a318a5daa8d40d69c5c7819a05eeed7}
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks: [backend, monitoring]
    mem_limit: 768m

  alertmanager:
    <<: *hardened
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a}
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets: [smtp_password]      # auth_password_file in alertmanager.yml, if the relay needs it
    # Delivers directly to the on-call receivers (SMTP/PagerDuty/Slack), hence egress.
    networks: [monitoring, egress]
    mem_limit: 128m

  grafana:
    <<: *hardened
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572}
    tmpfs: ["/tmp:size=32m"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000/
      GF_LOG_MODE: console                      # read-only filesystem: no log file
      GF_PLUGINS_PREINSTALL_DISABLED: "true"    # no internet access to fetch plugins
    secrets: [grafana_admin_password]
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [monitoring, admin]
    mem_limit: 512m

networks:
  public: {}
  edge:
    internal: true
    # The only network the API trusts forwarded headers from. Move it with
    # NEXUSFLOW_EDGE_SUBNET if it overlaps a network on the host.
    ipam: {config: [{subnet: "${NEXUSFLOW_EDGE_SUBNET:-172.28.1.0/24}"}]}
  admin: {internal: true}
  backend: {internal: true}
  automation: {internal: true}
  n8n_data: {internal: true}
  sandbox_net: {internal: true}
  render: {internal: true}
  monitoring: {internal: true}
  av: {internal: true}
  egress:
    # Internet access only - containers on it cannot talk to each other
    # (sandbox, browser, integrations worker and ClamAV stay isolated).
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"

volumes:
  nexusflow-data:
  api-tmp:
  pg-data:
  redis-data:
  rabbitmq-data:
  n8n-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:

secrets:
  # Internal TLS (scripts/internal_pki.py). The CA's own key stays on the host.
  internal_ca: {file: ./secrets/internal_ca.pem}
  tls_postgres_cert: {file: ./secrets/tls_postgres.pem}
  tls_postgres_key: {file: ./secrets/tls_postgres.key}
  tls_redis_cert: {file: ./secrets/tls_redis.pem}
  tls_redis_key: {file: ./secrets/tls_redis.key}
  tls_redis_sandbox_cert: {file: ./secrets/tls_redis_sandbox.pem}
  tls_redis_sandbox_key: {file: ./secrets/tls_redis_sandbox.key}
  tls_rabbitmq_cert: {file: ./secrets/tls_rabbitmq.pem}
  tls_rabbitmq_key: {file: ./secrets/tls_rabbitmq.key}
  postgres_password: {file: ./secrets/postgres_password}
  db_app_password: {file: ./secrets/db_app_password}
  db_migrator_password: {file: ./secrets/db_migrator_password}
  n8n_db_password: {file: ./secrets/n8n_db_password}
  db_app_url: {file: ./secrets/db_app_url}
  db_migrator_url: {file: ./secrets/db_migrator_url}
  redis_users_acl: {file: ./secrets/redis_users_acl}
  redis_app_url: {file: ./secrets/redis_app_url}
  redis_sandbox_url: {file: ./secrets/redis_sandbox_url}
  redis_sandbox_acl: {file: ./secrets/redis_sandbox_acl}
  rabbitmq_definitions: {file: ./secrets/rabbitmq_definitions}
  broker_platform_url: {file: ./secrets/broker_platform_url}
  broker_sandbox_url: {file: ./secrets/broker_sandbox_url}
  jwt_private_key: {file: ./secrets/jwt_private_key}
  encryption_keys: {file: ./secrets/encryption_keys}
  hmac_pepper: {file: ./secrets/hmac_pepper}
  n8n_webhook_jwt_secret: {file: ./secrets/n8n_webhook_jwt_secret}
  n8n_encryption_key: {file: ./secrets/n8n_encryption_key}
  browser_token: {file: ./secrets/browser_token}
  grafana_admin_password: {file: ./secrets/grafana_admin_password}
  # Optional, created empty by generate_secrets.py and filled in when needed:
  n8n_api_key: {file: ./secrets/n8n_api_key}
  smtp_password: {file: ./secrets/smtp_password}
  ai_api_key: {file: ./secrets/ai_api_key}
