# Platform Redis: rate limits, replay nonces and feature flags (kill switch).
# Authentication and authorization are per-user ACLs (users.acl secret): the
# default user is disabled and the platform user is confined to the `nf:`
# prefix. The sandbox pool has no account here - it uses redis-sandbox.

bind 0.0.0.0
port 6379
protected-mode yes
aclfile /run/secrets/redis_users_acl

# Persistence: the kill switch must survive restarts.
appendonly yes
appendfsync everysec
save ""

# Memory: only keys WITH a TTL are ever evicted (volatile-lru), so persistent
# flags such as the automation kill switch can never be evicted.
maxmemory 256mb
maxmemory-policy volatile-lru

# Hardening
enable-debug-command no
enable-module-command no
enable-protected-configs no
timeout 300
tcp-keepalive 60
latency-monitor-threshold 100
