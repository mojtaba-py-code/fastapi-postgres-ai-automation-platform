# The sandbox's Redis (docker-compose.yml): redis-sandbox.conf, served over TLS only.
include /usr/local/etc/redis/redis.conf

port 0
tls-port 6379
tls-cert-file /run/secrets/tls_redis_sandbox_cert
tls-key-file /run/secrets/tls_redis_sandbox_key
tls-ca-cert-file /run/secrets/internal_ca
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
