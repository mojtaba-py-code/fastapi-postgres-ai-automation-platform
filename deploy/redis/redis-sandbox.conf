# Redis for the sandbox pool only: robots.txt cache and per-host throttling.
# Disposable by design - no persistence, LRU eviction of ANY key, small cap -
# so a compromised sandbox can at most degrade its own cache. The platform's
# rate limits, replay guards and kill switch live in the separate main Redis.

bind 0.0.0.0
port 6379
protected-mode yes
aclfile /run/secrets/redis_sandbox_acl

appendonly no
save ""

maxmemory 48mb
maxmemory-policy allkeys-lru

enable-debug-command no
enable-module-command no
enable-protected-configs no
timeout 300
