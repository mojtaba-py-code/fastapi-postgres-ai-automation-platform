# The production stack's Redis (docker-compose.yml): redis.conf, served over TLS
# only. The development stack (docker-compose.dev.yml) loads redis.conf alone.
include /usr/local/etc/redis/redis.conf

port 0
tls-port 6379
tls-cert-file /run/secrets/tls_redis_cert
tls-key-file /run/secrets/tls_redis_key
tls-ca-cert-file /run/secrets/internal_ca
# Clients authenticate with their ACL passwords, over the verified TLS channel.
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
