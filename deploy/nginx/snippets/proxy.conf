# Upstream proxying to the public API.
proxy_pass http://api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Overwrite (never append): the application trusts exactly one hop, this proxy.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $nexusflow_request_id;  # UUID-shaped (nginx.conf)
proxy_set_header Forwarded "";
proxy_set_header X-Real-IP "";
# Timeouts are set per server block (and raised per location where a route
# needs more): a directive repeated in one block stops nginx from starting.
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
