# The web console: static files from ./web, with a policy of their own.
#
# A location that adds a header inherits none of the server's add_header
# directives, so every security header is set here in full. The console runs
# only its own scripts and styles (no inline code, no third party), talks only
# to its own origin, and - with Trusted Types and no policy - cannot hand a
# string to an HTML sink even by mistake.
root /usr/share/nginx/console;
# A budget of its own: a first load fetches all of the console's files at once,
# which must not spend the API's (the burst holds every file, with room to spare).
limit_req zone=console burst=100 nodelay;
etag on;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; require-trusted-types-for 'script'; trusted-types 'none'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Revalidated on every load (ETag): an update reaches browsers at once.
add_header Cache-Control "no-cache" always;
