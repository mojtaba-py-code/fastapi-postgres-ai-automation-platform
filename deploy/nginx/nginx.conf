# NexusFlow AI edge proxy (nginx-unprivileged: listens on 8080/8443 as non-root).
#
# * TLS termination (TLS 1.2+/1.3, modern ciphers) and HTTP->HTTPS redirect;
# * coarse per-IP rate limits in front of the application's own limits;
# * request size/time limits per route (uploads get a larger, unbuffered body);
# * X-Forwarded-For is *overwritten* with the peer address - client-supplied
#   forwarding headers are never passed through;
# * /metrics and /internal are never reachable from outside;
# * access logs are JSON and contain the path without the query string.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format json escape=json
        '{"time":"$time_iso8601","remote":"$remote_addr","request_id":"$request_id",'
        '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"duration":$request_time,"upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    client_max_body_size 1m;
    client_body_buffer_size 64k;
    large_client_header_buffers 4 8k;

    limit_req_zone $binary_remote_addr zone=api:20m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=webhooks:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Security headers for the responses the edge generates itself (hidden
    # paths, 413, 429, 502): the application sets the same ones on everything it
    # serves, so each is added only when the upstream sent none - never twice.
    # The edge serves TLS only, and the application sends HSTS whenever its
    # public URL is https - which it is behind this edge.
    map $upstream_http_strict_transport_security $edge_hsts {
        ""      "max-age=63072000; includeSubDomains";
        default "";
    }
    map $upstream_http_permissions_policy $edge_permissions_policy {
        ""      "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()";
        default "";
    }
    map $upstream_http_x_content_type_options $edge_nosniff { "" "nosniff"; default ""; }
    map $upstream_http_x_frame_options $edge_frame_options { "" "DENY"; default ""; }
    map $upstream_http_referrer_policy $edge_referrer_policy { "" "no-referrer"; default ""; }
    map $upstream_http_cache_control $edge_cache_control { "" "no-store"; default ""; }
    map $upstream_http_content_security_policy $edge_csp {
        ""      "default-src 'none'; frame-ancestors 'none'; base-uri 'none'";
        default "";
    }

    # Docker's DNS, re-asked every 10 s: a recreated API container gets a new
    # address, and a name resolved once at startup would answer 502 forever.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api {
        zone api_upstream 64k;
        server api:8000 resolve;
        keepalive 32;
    }

    # ----------------------------------------------------------- plain HTTP
    server {
        listen 8080 default_server;
        server_name _;
        # Let's Encrypt HTTP-01 challenges: certbot --webroot writes them to
        # deploy/acme (scripts/install_edge_cert.sh, DEPLOYMENT.md "TLS").
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------------- API
    server {
        listen 8443 ssl default_server;
        http2 on;
        server_name _;
        include /etc/nginx/snippets/tls.conf;
        limit_conn perip 50;

        add_header Strict-Transport-Security $edge_hsts always;
        add_header X-Content-Type-Options $edge_nosniff always;
        add_header X-Frame-Options $edge_frame_options always;
        add_header Referrer-Policy $edge_referrer_policy always;
        add_header Permissions-Policy $edge_permissions_policy always;
        add_header Cache-Control $edge_cache_control always;
        add_header Content-Security-Policy $edge_csp always;

        # Errors the edge answers itself use the application's JSON error schema
        # (the application's own error responses pass through untouched).
        error_page 404 = @edge_not_found;
        error_page 413 = @edge_too_large;
        error_page 429 = @edge_rate_limited;
        error_page 502 503 504 = @edge_unavailable;

        # Upstream timeouts for every location below; streaming downloads raise
        # the read timeout (their location, not the shared proxy snippet).
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        location @edge_not_found {
            default_type application/json;
            return 404 '{"error":"not_found","message":"The resource does not exist.","request_id":"$request_id"}';
        }
        location @edge_too_large {
            default_type application/json;
            return 413 '{"error":"payload_too_large","message":"The request body is too large.","request_id":"$request_id"}';
        }
        location @edge_rate_limited {
            default_type application/json;
            return 429 '{"error":"rate_limited","message":"Too many requests; slow down.","request_id":"$request_id"}';
        }
        location @edge_unavailable {
            default_type application/json;
            return 503 '{"error":"service_unavailable","message":"The service is temporarily unavailable.","request_id":"$request_id"}';
        }

        location = /metrics { return 404; }
        location ^~ /internal/ { return 404; }
        location ^~ /docs { return 404; }
        location = /openapi.json { return 404; }

        location ^~ /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            include /etc/nginx/snippets/proxy.conf;
        }

        location ^~ /api/v1/webhooks/ {
            limit_req zone=webhooks burst=100 nodelay;
            include /etc/nginx/snippets/proxy.conf;
        }

        location ~ ^/api/v1/sources/[^/]+/uploads$ {
            limit_req zone=api burst=10 nodelay;
            client_max_body_size 25m;
            client_body_timeout 120s;
            proxy_request_buffering off;
            include /etc/nginx/snippets/proxy.conf;
        }

        location ~ ^/api/v1/(datasets/[^/]+/export|reports/[^/]+/download)$ {
            limit_req zone=api burst=5 nodelay;
            proxy_buffering off;
            proxy_read_timeout 300s;
            include /etc/nginx/snippets/proxy.conf;
        }

        location / {
            limit_req zone=api burst=40 nodelay;
            include /etc/nginx/snippets/proxy.conf;
        }
    }

    # ------------------------------------------- admin (127.0.0.1 only, see compose)
    server {
        listen 5678;
        server_name _;
        client_max_body_size 16m;
        location / {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $n8n http://n8n:5678;
            proxy_pass $n8n;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;   # with the port: n8n checks it against Origin
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
        }
    }

    server {
        listen 3000;
        server_name _;
        location / {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $grafana http://grafana:3000;
            proxy_pass $grafana;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
