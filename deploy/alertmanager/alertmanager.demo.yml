# Demo overlay only (docker-compose.demo.yml): alerts land in Mailpit
# (http://127.0.0.1:8025), over STARTTLS verified against the development CA.

global:
  resolve_timeout: 5m

route:
  receiver: operators
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: operators
    email_configs:
      - to: ops@nexusflow.example.com
        from: alerts@nexusflow.example.com
        smarthost: mailpit:1025
        require_tls: true
        tls_config:
          ca_file: /certs/dev-ca.pem
          server_name: mailpit
        send_resolved: true

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname, service]
