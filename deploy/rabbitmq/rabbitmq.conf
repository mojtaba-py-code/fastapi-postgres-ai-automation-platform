# RabbitMQ broker for Celery. Users, vhost, permissions, exchanges and quorum
# queues come from the generated definitions secret (password hashes only).
load_definitions = /run/secrets/rabbitmq_definitions

# Listeners: plain AMQP on 5672 by default; the production stack replaces it
# with TLS on 5671 (tls.conf).
# The guest account may only ever connect from inside the container.
loopback_users.guest = true

# Bound message size and memory; tasks carry identifiers only.
max_message_size = 4194304
vm_memory_high_watermark.relative = 0.6
# The watermark is a share of the memory RabbitMQ believes it has - by default
# the HOST's, not the container's: on an 8 GiB host flow control would start
# near 4.8 GiB and the kernel would kill the 768 MiB container long before.
# Keep this equal to mem_limit in docker-compose.yml (768 MiB).
total_memory_available_override_value = 805306368
disk_free_limit.absolute = 1GB

# Quorum queues are the default queue type for this cluster.
default_queue_type = quorum

# Deprecated features stay refused (RabbitMQ 4.3's defaults, stated so that an
# upgrade cannot quietly turn them on): no transient non-exclusive queues, no
# global QoS - the workers need neither.
deprecated_features.permit.transient_nonexcl_queues = false
deprecated_features.permit.global_qos = false

log.console = true
log.console.level = info
log.file = false

# Metrics for Prometheus (port 15692, internal network only).
prometheus.return_per_object_metrics = false
