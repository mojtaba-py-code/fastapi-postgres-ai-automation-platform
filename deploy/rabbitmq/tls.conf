# AMQP over TLS only, for the production stack (docker-compose.yml loads it after
# rabbitmq.conf; the development stack does not, and keeps plain AMQP on 5672).
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /run/secrets/internal_ca
ssl_options.certfile = /run/secrets/tls_rabbitmq_cert
ssl_options.keyfile = /run/secrets/tls_rabbitmq_key
# Clients authenticate with passwords over the verified channel, not certificates.
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
