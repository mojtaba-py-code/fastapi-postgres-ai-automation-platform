global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: {service: api-public}
  - job_name: api-internal
    metrics_path: /metrics
    static_configs:
      - targets: ["api-internal:8001"]
        labels: {service: api-internal}
  - job_name: workers
    static_configs:
      - targets: ["worker-pipeline:9101"]
        labels: {service: worker-pipeline}
      - targets: ["worker-integrations:9101"]
        labels: {service: worker-integrations}
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels: {service: rabbitmq}
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
