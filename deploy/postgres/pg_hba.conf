# PostgreSQL client authentication for the NexusFlow stack (docker-compose.yml
# mounts it read-only and points hba_file here).
#
# TYPE     DATABASE  USER  ADDRESS    METHOD
# The local socket: the container's own tools (initialisation, backups, restores).
local      all       all              scram-sha-256
# Every network connection must use TLS; a plaintext one matches no line and is refused.
hostssl    all       all   0.0.0.0/0  scram-sha-256
hostssl    all       all   ::/0       scram-sha-256
