[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nexusflow-ai"
version = "0.1.0"
description = "NexusFlow AI - enterprise automation and competitive-intelligence platform (FastAPI, n8n, Celery, PostgreSQL, Redis)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mojtaba Karimi" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    # --- web / api -------------------------------------------------------
    "fastapi>=0.141,<0.143",
    "uvicorn>=0.53,<1",
    "httptools>=0.6.4",
    "uvloop>=0.21; sys_platform != 'win32'",
    "python-multipart>=0.0.32",
    # --- validation / configuration --------------------------------------
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "email-validator>=2.3,<3",
    # --- persistence -----------------------------------------------------
    "sqlalchemy[asyncio]>=2.0.54,<2.2",
    "asyncpg>=0.31,<1",
    "alembic>=1.20,<2",
    "redis>=8.1,<9",
    # --- background processing -------------------------------------------
    "celery>=5.6,<6",
    # --- outbound http (maintained fork of httpx, shared with the Anthropic SDK)
    "httpx2>=2.13,<3",
    # --- scraping / parsing ----------------------------------------------
    "beautifulsoup4>=4.15,<5",
    "lxml>=6.1,<7",
    "openpyxl>=3.1.5,<4",
    "defusedxml>=0.7.1,<1",
    # --- security --------------------------------------------------------
    "argon2-cffi>=25.1,<26",
    "pyjwt[crypto]>=2.15,<3",
    "cryptography>=50,<51",
    "pyotp>=2.10,<3",
    # --- ai --------------------------------------------------------------
    "anthropic>=1.8,<2",
    # --- notifications / reporting -----------------------------------------
    "aiosmtplib>=5.1,<6",
    "reportlab>=5.0,<6",
    # --- observability ---------------------------------------------------
    "structlog>=26.1",
    "prometheus-client>=0.26,<1",
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0,<1",
    "opentelemetry-instrumentation-celery>=0.65b0,<1",
]

[project.optional-dependencies]
# Isolated JavaScript rendering service (deployed as its own container).
browser = ["playwright>=1.63,<2"]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "hypothesis>=6.168",
    "fakeredis[lua]>=2.38,<3",
    "asgi-lifespan>=2.1,<3",
    "ruff>=0.16.8",
    "mypy>=2.3,<3",
    "bandit[toml]>=1.9.4",
    "pip-audit>=2.10",
    "import-linter>=2.15",
    "celery-types>=0.26",
    "types-openpyxl",
    "types-reportlab",
    "types-defusedxml",
    "lxml-stubs",
]
# Embedded PostgreSQL for running the integration suite without Docker.
localdb = ["pgserver>=0.1.4"]

[project.scripts]
nexusflow = "nexusflow.apps.cli.main:main"

[project.urls]
Documentation = "https://github.com/mojtaba-py-code/fastapi-postgres-ai-automation-platform/tree/main/docs"
Security = "https://github.com/mojtaba-py-code/fastapi-postgres-ai-automation-platform/blob/main/SECURITY.md"

[tool.hatch.build.targets.wheel]
packages = ["src/nexusflow"]

[tool.hatch.build.targets.sdist]
include = ["src/nexusflow", "migrations", "alembic.ini", "README.md", "LICENSE"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations/versions/*.py.mako"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RET", "PTH",
    "ERA", "PL", "RUF", "ASYNC", "PERF", "S", "BLE", "LOG", "G", "PIE", "TID", "ISC",
    "FURB", "SLOT",
]
ignore = [
    "PLR0913",  # explicit dependency injection legitimately needs several parameters
    "PLR2004",  # magic values are clearer inline for HTTP status codes and limits
    "ISC001",   # conflicts with the formatter
    "S311",     # `random` is used only for backoff jitter, never for security
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S104", "S105", "S106", "S108", "PLR0915", "PLC0415", "ARG", "SLF001", "RUF001", "RUF003"]
"migrations/**/*.py" = ["E501", "ERA001"]
"scripts/**/*.py" = ["T201"]
"src/nexusflow/apps/cli/**/*.py" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pickle".msg = "Insecure deserialization: never use pickle for untrusted data."
"marshal".msg = "Insecure deserialization: never use marshal."
"shelve".msg = "Insecure deserialization: shelve is pickle-based."
"xml.etree.ElementTree".msg = "Use defusedxml for XML parsing."
"xml.dom.minidom".msg = "Use defusedxml for XML parsing."
"yaml.load".msg = "Use yaml.safe_load."
"os.system".msg = "Use subprocess with an argument list and shell=False."
"httpx".msg = "Use httpx2 (maintained fork); outbound calls to user URLs must go through nexusflow.infrastructure.http."

[tool.ruff.lint.pylint]
max-args = 8
max-returns = 8
max-branches = 14

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["nexusflow"]
cache_dir = ".mypy_cache"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["pyotp.*", "pgserver.*", "kombu.*", "opentelemetry.instrumentation.*", "playwright.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = ["-ra", "--strict-markers", "--strict-config", "-p", "no:cacheprovider"]
markers = [
    "integration: requires PostgreSQL (real or embedded) and exercises the database layer",
    "security: security regression tests (authn, authz, tenancy, SSRF, injection, uploads, webhooks)",
    "e2e: requires the full docker-compose stack (set NEXUSFLOW_E2E_BASE_URL)",
    "slow: slow tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:celery.*",
    "ignore::DeprecationWarning:kombu.*",
    "ignore::DeprecationWarning:pgserver.*",
    "ignore::ResourceWarning",
]

[tool.coverage.run]
source = ["nexusflow"]
branch = true
# SQLAlchemy's asyncio layer runs on greenlets: without this, lines after a
# database round trip are missed and coverage is under-reported.
concurrency = ["greenlet", "thread"]
omit = ["src/nexusflow/apps/browser/app.py"]  # render() needs a real Chromium

[tool.coverage.report]
# Line and branch coverage of the whole suite is about 90 %; the floor catches
# a change that lands without its tests.
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.$",
]

# ---------------------------------------------------------------------------
# Bandit
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations"]

# ---------------------------------------------------------------------------
# Architecture contracts (import-linter)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "nexusflow"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture: apps -> bootstrap -> infrastructure -> domain -> core"
type = "layers"
layers = [
    "nexusflow.apps",
    "nexusflow.bootstrap",
    "nexusflow.infrastructure",
    "nexusflow.domain",
    "nexusflow.core",
]

[[tool.importlinter.contracts]]
name = "Domain is framework-free"
type = "forbidden"
source_modules = ["nexusflow.domain", "nexusflow.core"]
forbidden_modules = [
    "fastapi", "starlette", "sqlalchemy", "asyncpg", "celery", "redis", "httpx2",
    "anthropic", "bs4", "openpyxl", "reportlab", "structlog", "prometheus_client",
]
